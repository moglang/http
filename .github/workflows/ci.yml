name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.target }} / Mog ${{ matrix.runtime_ref }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
            runtime_ref: v0.1.6
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
            runtime_ref: main
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            runtime_ref: main
          - runner: macos-14
            target: macos-arm64
            runtime_ref: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: moglang/mog
          ref: ${{ matrix.runtime_ref }}
          path: .runtime/mog
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' mog.toml | head -n 1)"
          test -n "$version"
          test -f LICENSE
          test -f package.api.mog
          test -f tests/test_http_package.sh
          grep -Fq "## $version" CHANGELOG.md
          grep -q '^```mog' README.md
          grep -Fq '"${{ matrix.target }}"' mog.toml
          grep -Fq "GNU GENERAL PUBLIC LICENSE" LICENSE
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build Mog runtime
        run: |
          cmake -S .runtime/mog -B .runtime/mog/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .runtime/mog/build --parallel
      - name: Build, validate, and test package
        run: |
          ./tests/test_http_package.sh ./.runtime/mog/build/interpreter .

  validate:
    if: always()
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require compatibility matrix
        env:
          RESULT: ${{ needs.compatibility.result }}
        run: test "$RESULT" = success
