name: Package CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.target }} / Mog ${{ matrix.runtime_ref }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64-gnu
            runtime_ref: main
          - runner: ubuntu-24.04-arm
            target: linux-arm64-gnu
            runtime_ref: main
          - runner: macos-14
            target: macos-arm64
            runtime_ref: main
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: moglang/mog
          ref: ${{ matrix.runtime_ref }}
          path: .runtime/mog
      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^\"]*\)"/\1/p' mog.toml | head -n 1)"
          test -n "$version"
          test -f LICENSE
          test -f package.api.mog
          test -f tests/test_http_package.sh
          grep -Fq "## $version" CHANGELOG.md
          grep -q '^```mog' README.md
          grep -Fq '"${{ matrix.target }}"' mog.toml
          grep -Fq "GNU GENERAL PUBLIC LICENSE" LICENSE
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
      - name: Build Mog runtime
        run: |
          cmake -S .runtime/mog -B .runtime/mog/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .runtime/mog/build --parallel
      - name: Build, validate, and test package
        run: |
          ./tests/test_http_package.sh ./.runtime/mog/build/interpreter .

  validate:
    if: always()
    needs: [compatibility, sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require compatibility matrix
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$SANITIZER_RESULT" = success

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            mode: asan-ubsan
          - name: TSan smoke
            mode: tsan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: moglang/mog
          ref: main
          path: .runtime/mog
      - name: Build instrumented Mog runtime
        env:
          SANITIZER_MODE: ${{ matrix.mode }}
        run: |
          if [[ "$SANITIZER_MODE" == "asan-ubsan" ]]; then
            cmake -S .runtime/mog -B .runtime/mog/build \
              -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON
          else
            cmake -S .runtime/mog -B .runtime/mog/build \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
              -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          fi
          cmake --build .runtime/mog/build --target interpreter --parallel 2
      - name: Run instrumented package suite
        env:
          MOG_HTTP_SANITIZER: ${{ matrix.mode }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [[ "${{ matrix.mode }}" == "tsan" ]]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
          fi
          ./tests/test_http_package.sh ./.runtime/mog/build/interpreter .
